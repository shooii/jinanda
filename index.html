<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='9'%20fill='%232f6cf6'/%3E%3Cpath%20d='M12%208v12h9'%20stroke='white'%20stroke-width='3'%20stroke-linecap='round'%20stroke-linejoin='round'%20fill='none'/%3E%3C/svg%3E"
    />
    <title>LingoPods · AI 翻译耳机</title>
    <script>
      try {
        var rawTheme = localStorage.getItem("lingo.theme")
        var theme = null
        if (rawTheme) {
          try {
            theme = JSON.parse(rawTheme)
          } catch (error) {}
        }
        if (theme !== "dark" && theme !== "light") {
          theme =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
        }
        document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
